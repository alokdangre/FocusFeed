AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FocusFeed TypeSafe Jev objective and video classification API

Parameters:
  TypeSafeApiKey:
    Type: String
    NoEcho: true
  TypeSafeModel:
    Type: String
    Default: jev-1.13.0

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 768
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TYPESAFE_API_KEY: !Ref TypeSafeApiKey
        TYPESAFE_MODEL: !Ref TypeSafeModel

Resources:
  FocusFeedApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - x-request-id
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.lambda_handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusFeedApi
            Path: /health
            Method: GET
        ObjectiveClassify:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusFeedApi
            Path: /objectives/classify
            Method: POST
        ClearCache:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusFeedApi
            Path: /cache/clear
            Method: POST
        ChannelClassify:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusFeedApi
            Path: /channels/classify
            Method: POST
        Classify:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusFeedApi
            Path: /classify
            Method: POST

Outputs:
  ApiUrl:
    Description: FocusFeed classification API base URL
    Value: !Sub https://${FocusFeedApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
